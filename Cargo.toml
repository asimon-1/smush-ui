[package]
name = "smush-ui"
version = "0.1.0"
authors = []
edition = "2024"

[dependencies]
atomic-write-file = "0.3"
bilge = { version = "0.5.0", features = ["serde"] }
binrw = "0.15"
clap = { version = "4.5", features = ["derive"] }
png = "=0.18.1"
rusty_dds = { version = "=0.9.0", default-features = false, features = ["decode", "encode"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_jsonc2 = "0.1.2"
walkdir = "2.5"

# rusty_dds 0.9.0 contains a reachable debug-only assertion in its scalar BC7
# encoder; release builds already omit it and the guarded code handles the case.
[profile.dev.package.rusty_dds]
debug-assertions = false

[profile.test.package.rusty_dds]
debug-assertions = false
